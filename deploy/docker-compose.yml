# The service behind an HTTPS proxy. On the server, in the jobbot folder:
#   cp deploy/env.example deploy/.env      (then fill it in)
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
# Two processes share one data volume: the customer portal, and the admin panel, which also runs the
# scheduler (exactly one process may start runs), the daily backup and the alert checks.
x-app: &app
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  restart: unless-stopped
  volumes:
    - data:/data
    - backups:/backups
  env_file: .env
  environment:
    JOBBOT_DATA: /data
    JOBBOT_BACKUP_COPY_TO: /backups   # a second copy of every backup, on its own volume

services:
  customer:
    <<: *app
    command: ["python", "-m", "jobbot", "serve", "--host", "0.0.0.0", "--site", "customer", "--port", "8765"]
    expose: ["8765"]                  # reachable by the proxy only, never from outside
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 20s

  admin:
    <<: *app
    command: ["python", "-m", "jobbot", "serve", "--host", "0.0.0.0", "--site", "admin", "--port", "8766"]
    expose: ["8766"]
    healthcheck:                      # 503 when the database, the scheduler or the disk has a problem
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8766/health/deep', timeout=4)"]
      interval: 60s
      timeout: 8s
      start_period: 60s

  proxy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [customer, admin]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env, e.g. jobpilot.example.com}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?set ADMIN_DOMAIN in deploy/.env, e.g. admin.jobpilot.example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data                   # the HTTPS certificates Caddy obtains by itself

volumes:
  data:
  backups:
  caddy:
