# NO LONGER READ BY THE BOT. Since 2026-10-12 the job sources live in the database table `sources`
# (jobbot.db). Manage them with `jobbot source list / on / off / add / remove`, the admin page, or
# the API (GET/POST /sources, PUT/DELETE /sources/{name}). Editing this file changes nothing.
# It is only the starting list: it is copied into the table once, when the table does not exist yet.
# adapter = which reader in jobbot/sources/ handles it.

