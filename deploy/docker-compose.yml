# The service behind an HTTPS proxy. NOT YET RUN (no Docker on the PC this was written on).
# On the server, in the jobbot folder:
#   DOMAIN=bot.example.com docker compose -f deploy/docker-compose.yml up -d --build
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    volumes:
      - data:/data
    environment:
      JOBBOT_DATA: /data
    expose:
      - "8765"            # reachable by the proxy only, never from outside

  proxy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN to the address people will open, e.g. bot.example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data       # the HTTPS certificates Caddy obtains by itself

volumes:
  data:
  caddy:
